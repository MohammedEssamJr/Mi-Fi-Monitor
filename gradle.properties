android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# GitHub-hosted runners default to a small daemon heap, which isn't
# enough to dex Compose + Material icons — this caused an
# OutOfMemoryError during :app:mergeExtDexDebug. 3GB is comfortably
# under the runner's ~7GB RAM.
org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
